[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-id"
version = "1.0.0"
description = "Self-Sovereign Identity for Hermes Agent — Ed25519 DID, verifiable identity cards, secure handshake protocol"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Hermes ID Contributors"}
]
keywords = ["hermes", "identity", "did", "cryptography", "ed25519", "authentication"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
argon2 = ["argon2-cffi>=21.0.0"]
all = [
    "argon2-cffi>=21.0.0",
]

[project.scripts]
hermes-id = "hermes_id.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
