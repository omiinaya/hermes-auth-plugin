[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-id"
version = "1.4.2"
description = "Self-Sovereign Identity for Hermes Agent — Ed25519 DID, verifiable identity cards, secure handshake protocol, HTTP auth server, and MCP server"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "Hermes ID Contributors"}
]
keywords = ["hermes", "identity", "did", "cryptography", "ed25519", "authentication", "mcp", "auth-server"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
argon2 = ["argon2-cffi>=21.0.0"]
server = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
]
mcp = [
    "mcp>=1.0.0",
]
all = [
    "argon2-cffi>=21.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
    "mcp>=1.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-timeout>=2.2.0",
    "pytest-cov>=5.0.0",
    "coverage>=7.0.0",
    "ruff>=0.6.0",
    "build>=1.0.0",
    "twine>=5.0.0",
]

[project.scripts]
hermes-id = "hermes_id.cli:main"
hermes-id-admin = "hermes_id.admin_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Negative tests intentionally assert that *some* exception is raised
"tests/*" = ["B017", "BLE001"]
# Hermes plugins live in hyphenated dirs (plugins/hermes-id/) — not importable
# as normal Python modules, so N999 (invalid module name) doesn't apply.
"plugins/*" = ["N999"]
# Examples use FastAPI's canonical `Depends()`-in-default idiom — B008
# doesn't apply to FastAPI dependencies.
"examples/*" = ["B008"]
