name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:  # allow manual re-runs from the Actions tab

jobs:
  test:
    runs-on: [self-hosted, ubuntu-latest]
    strategy:
      matrix:
        # Debian 12 self-hosted runner: actions/setup-python has NO prebuilt
        # versions for Debian 12 (3.11/3.12/3.13 all fail). Use the system
        # Python 3.11 which is pre-installed on the runner.
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        run: |
          PY=$(command -v python3.11 || command -v python3)
          echo "Using system Python: $PY ($($PY --version 2>&1))"
          # System python3.11 is the root-owned hermes-agent venv — create a
          # fresh job-local venv so pip can install without permission issues.
          $PY -m venv "$RUNNER_TEMP/ci-venv"
          echo "$RUNNER_TEMP/ci-venv/bin" >> "$GITHUB_PATH"
          # NOTE: use $PY, not plain `python` — the runner PATH has no bare
          # `python` symlink, so `python --version` here exits 127 and the
          # step (and whole job) fails before any test runs.
          "$PY" --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"

      - name: Lint
        run: |
          pip install ruff
          ruff check src/ tests/

      - name: Test
        run: |
          python -m pytest tests/ -v --tb=short --cov=hermes_id --cov-report=term-missing --cov-fail-under=85
          # pytest-cov writes .coverage to the repo root; confirm it exists
          # and normalize its name for the artifact step.
          ls -la .coverage && cp .coverage coverage-${{ matrix.python-version }}.data 2>/dev/null || true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            .coverage
            coverage-*.data
          if-no-files-found: warn
          retention-days: 14

      - name: Test server import
        run: |
          python -c "from hermes_id.server import AuthServer; print('OK: server')"
          python -c "from hermes_id.auth_client import AuthClient; print('OK: auth_client')"
          python -c "from hermes_id.mcp_server import HermesIDMCPServer; print('OK: mcp_server')"
