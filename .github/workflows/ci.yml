name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:  # allow manual re-runs from the Actions tab

# Cancel superseded runs: only the latest push/PR per ref actually runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"

      - name: Lint
        run: |
          # ruff comes from the [dev] extras installed above.
          ruff check src/ tests/

      - name: Test
        run: |
          # Tests use ephemeral ports so worker isolation is safe.
          python -m pytest tests/ -v --tb=short -n 16 --cov=hermes_id --cov-report=term-missing --cov-fail-under=85
          # pytest-cov writes .coverage to the repo root; confirm it exists
          # and normalize its name for the artifact step.
          ls -la .coverage && cp .coverage coverage-${{ matrix.python-version }}.data 2>/dev/null || true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            .coverage
            coverage-*.data
          if-no-files-found: warn
          retention-days: 14

      - name: Test server import
        run: |
          python -c "from hermes_id.server import AuthServer; print('OK: server')"
          python -c "from hermes_id.auth_client import AuthClient; print('OK: auth_client')"
          python -c "from hermes_id.mcp_server import HermesIDMCPServer; print('OK: mcp_server')"
