name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: [self-hosted, ubuntu-latest]
    strategy:
      matrix:
        # Debian 12 self-hosted runner: 3.11 not in setup-python prebuilt
        # cache (system python3.11 covers it locally); 3.12/3.13 available.
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"

      - name: Lint
        run: |
          pip install ruff
          ruff check src/ tests/

      - name: Test
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Test server import
        run: |
          python -c "from hermes_id.server import AuthServer; print('OK: server')"
          python -c "from hermes_id.auth_client import AuthClient; print('OK: auth_client')"
          python -c "from hermes_id.mcp_server import HermesIDMCPServer; print('OK: mcp_server')"

  docker:
    runs-on: [self-hosted, ubuntu-latest]
    needs: test
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t hermes-id-auth .
