name: Publish to PyPI

# Pushes a release whenever a tag like v1.2.0 is created.
# Uses trusted publishing (OIDC) — NO PyPI token needed.
#
# One-time setup required (from the PyPI account owner):
#   1. Create the project `hermes-id` on PyPI (or TestPyPI for testing)
#   2. Publish → Add a new trusted publisher:
#        workflow name: publish.yml
#        environment:   pypi  (or testpypi)
#        issuer:        https://token.actions.githubusercontent.com
#   3. Tag and push:  git tag v1.2.0 && git push origin v1.2.0

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write   # required for trusted publishing

jobs:
  publish:
    runs-on: [self-hosted, ubuntu-latest]
    environment: pypi
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        run: |
          # Debian 12 self-hosted runner: actions/setup-python has NO prebuilt
          # versions (see ci.yml). Use the system Python 3.11 + job-local venv.
          PY=$(command -v python3.11 || command -v python3)
          $PY -m venv "$RUNNER_TEMP/pypi-venv"
          echo "$RUNNER_TEMP/pypi-venv/bin" >> "$GITHUB_PATH"
          # NOTE: use $PY, not bare `python` — runner PATH has no `python`
          # symlink (same exit-127 class as ci.yml).
          "$PY" --version

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist + wheel
        run: python -m build

      - name: Check artifacts
        run: python -m twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
