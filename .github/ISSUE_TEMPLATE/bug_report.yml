name: Bug report
description: File a bug report for hermes-id
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue!

        > **Security vulnerability?** Do NOT use this form. Report privately via
        > [SECURITY.md](../SECURITY.md) — GitHub advisory, Matrix, or email.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect to happen, and what actually happened?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Minimal steps or a small script to reproduce.
      placeholder: |
        1. Run `hermes-id init --dir /tmp/ident --password test`
        2. Run `hermes-id verify <file>`
        3. See error...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: hermes-id version
      description: Output of `hermes-id --version` (or `pip show hermes-id`)
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      description: e.g. 3.11.2
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Platform / OS
      options:
        - Linux
        - macOS
        - Windows
        - Other / container
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / traceback
      description: Paste any error output. Redact credentials and private keys — never paste `private.enc` contents or passphrases.
      render: shell

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that might help (deployment type, integration, etc.)