version: "3.8"

services:
  hermes-id-auth:
    build: .
    container_name: hermes-id-auth
    ports:
      - "9488:9488"
    environment:
      - HERMES_ID_PASSPHRASE=${HERMES_ID_PASSPHRASE:?Set HERMES_ID_PASSPHRASE}
      - HERMES_ID_ADMIN_KEY=${HERMES_ID_ADMIN_KEY:-}
    volumes:
      - ./identity:/app/identity
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9488/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
